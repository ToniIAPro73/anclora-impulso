name: Promote / Environment

# Manual, human-gated promotion. Moves target branch ref to exact SHA
# already validated upstream. Fast-forward only: no merge/rebase/
# cherry-pick/force push.
#
# CI gate (fail-closed, inside GitHub Actions):
# - Source SHA is exact and immutable for the run.
# - Required checks and authorized check-run apps come from
#   .anclora/PRODUCTION_RUNTIME.md at that exact SHA.
# - Check-runs are fully paginated and reconciled with total_count.
# - Every required check is present for the SHA, completed and SUCCESS from an
#   authorized app. Duplicate/ambiguous apps, runs or pages fail closed.
# - Optional observed check-runs must not be pending or failing.
# - Legacy commit statuses, when present, must be success.
# The agent only dispatches; it never polls CI.
#
# development -> staging -> production -> main

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Branch to promote into, or full chain"
        required: true
        type: choice
        options: [staging, production, main, full]
      source_sha:
        description: "Exact current development SHA (required for full chain)"
        required: false
        type: string

permissions:
  statuses: read
  checks: read
  contents: write
concurrency:
  group: promote-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify source and checks
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
      source_branch: ${{ steps.source.outputs.source_branch }}
      required_checks: ${{ steps.source.outputs.required_checks }}
      authorized_apps: ${{ steps.source.outputs.authorized_apps }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve source SHA
        id: source
        shell: bash
        env:
          TARGET: ${{ inputs.target }}
          REVIEWED_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          fail() { echo "::error::PROMOTION_BLOCKED_$1"; exit 1; }
          if [ "$TARGET" = "full" ]; then
            [ "${GITHUB_REF_NAME:-}" = "development" ] || fail "WRONG_REF: dispatch the full chain from development."
            [ -n "$REVIEWED_SHA" ] || fail "MISSING_REVIEWED_SHA: supply the exact development SHA."
            git fetch origin "+refs/heads/development:refs/remotes/origin/development"
            git cat-file -e "$REVIEWED_SHA^{commit}" || fail "UNKNOWN_SOURCE_SHA: the reviewed SHA is not in this repository."
            current_development_sha="$(git rev-parse origin/development)"
            [ "$current_development_sha" = "$REVIEWED_SHA" ] || fail "DEVELOPMENT_MOVED: development changed after the source SHA was selected."
            source_sha="$REVIEWED_SHA"
            source_branch="development"
          else
            case "$TARGET" in
              staging) source_branch="development" ;;
              production) source_branch="staging" ;;
              main) source_branch="production" ;;
              *) fail "INVALID_TARGET: unsupported promotion target $TARGET." ;;
            esac
            git fetch origin "$source_branch"
            source_sha="$(git rev-parse "origin/$source_branch")"
          fi

          contract="$(git show "$source_sha:.anclora/PRODUCTION_RUNTIME.md" 2>/dev/null || true)"
          [ -n "$contract" ] || fail "MISSING_RUNTIME_CONTRACT: the source SHA has no .anclora/PRODUCTION_RUNTIME.md."

          # Required check names (comma-separated, exactly one declaration).
          count="$(printf '%s\n' "$contract" | grep -cE '^PROMOTION_REQUIRED_CHECKS=' || true)"
          [ "$count" -gt 0 ] || fail "MISSING_REQUIRED_CHECKS_DECLARATION: declare PROMOTION_REQUIRED_CHECKS."
          [ "$count" -eq 1 ] || fail "AMBIGUOUS_REQUIRED_CHECKS_DECLARATION: declare PROMOTION_REQUIRED_CHECKS exactly once."
          required_line="$(printf '%s\n' "$contract" | grep -E '^PROMOTION_REQUIRED_CHECKS=' | head -n 1)"
          required_raw="${required_line#PROMOTION_REQUIRED_CHECKS=}"
          [ -n "$(printf '%s' "$required_raw" | tr -d '[:space:]')" ] \
            || fail "INVALID_REQUIRED_CHECKS_DECLARATION: PROMOTION_REQUIRED_CHECKS is empty."
          IFS=',' read -ra required <<< "$required_raw"
          required_checks=""
          for name in "${required[@]}"; do
            name="$(printf '%s' "$name" | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//')"
            [ -n "$name" ] || fail "INVALID_REQUIRED_CHECKS_DECLARATION: empty required check."
            required_checks="${required_checks:+$required_checks,}$name"
          done
          [ -n "$required_checks" ] || fail "INVALID_REQUIRED_CHECKS_DECLARATION: PROMOTION_REQUIRED_CHECKS is empty."
          dupes="$(printf '%s' "$required_checks" | tr ',' '\n' | sort | uniq -d)"
          [ -z "$dupes" ] || fail "AMBIGUOUS_REQUIRED_CHECKS_DECLARATION: duplicate ($dupes)."

          # Authorized check-run app slugs (comma-separated, exactly one declaration).
          count="$(printf '%s\n' "$contract" | grep -cE '^PROMOTION_AUTHORIZED_CHECK_APPS=' || true)"
          [ "$count" -gt 0 ] || fail "MISSING_AUTHORIZED_CHECK_APPS_DECLARATION: declare PROMOTION_AUTHORIZED_CHECK_APPS."
          [ "$count" -eq 1 ] || fail "AMBIGUOUS_AUTHORIZED_CHECK_APPS_DECLARATION: declare PROMOTION_AUTHORIZED_CHECK_APPS exactly once."
          apps_line="$(printf '%s\n' "$contract" | grep -E '^PROMOTION_AUTHORIZED_CHECK_APPS=' | head -n 1)"
          apps_raw="${apps_line#PROMOTION_AUTHORIZED_CHECK_APPS=}"
          [ -n "$(printf '%s' "$apps_raw" | tr -d '[:space:]')" ] \
            || fail "INVALID_AUTHORIZED_CHECK_APPS_DECLARATION: PROMOTION_AUTHORIZED_CHECK_APPS is empty."
          IFS=',' read -ra apps <<< "$apps_raw"
          authorized_apps=""
          for app in "${apps[@]}"; do
            app="$(printf '%s' "$app" | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//')"
            [ -n "$app" ] || fail "INVALID_AUTHORIZED_CHECK_APPS_DECLARATION: empty app slug."
            case "$app" in
              *[!a-z0-9-]*) fail "INVALID_AUTHORIZED_CHECK_APPS_DECLARATION: app slug must be lowercase [a-z0-9-]: $app" ;;
            esac
            authorized_apps="${authorized_apps:+$authorized_apps,}$app"
          done
          [ -n "$authorized_apps" ] || fail "INVALID_AUTHORIZED_CHECK_APPS_DECLARATION: PROMOTION_AUTHORIZED_CHECK_APPS is empty."
          app_dupes="$(printf '%s' "$authorized_apps" | tr ',' '\n' | sort | uniq -d)"
          [ -z "$app_dupes" ] || fail "AMBIGUOUS_AUTHORIZED_CHECK_APPS_DECLARATION: duplicate ($app_dupes)."

          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "source_branch=$source_branch" >> "$GITHUB_OUTPUT"
          echo "required_checks=$required_checks" >> "$GITHUB_OUTPUT"
          echo "authorized_apps=$authorized_apps" >> "$GITHUB_OUTPUT"

      - name: Verify source check-runs and commit status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          REQUIRED_CHECKS: ${{ steps.source.outputs.required_checks }}
          AUTHORIZED_APPS: ${{ steps.source.outputs.authorized_apps }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          fail() { echo "::error::PROMOTION_BLOCKED_$1"; exit 1; }

          # Fetch every page. A failed request must never become an empty list.
          if ! pages="$(gh api --paginate "repos/$GITHUB_REPOSITORY/commits/$SOURCE_SHA/check-runs?per_page=100")"; then
            fail "GITHUB_API_ERROR: check-runs request failed (HTTP/auth/rate limit)."
          fi
          page_count="$(jq -s 'length' <<< "$pages" 2>/dev/null || true)"
          case "$page_count" in
            ''|0|*[!0-9]*) fail "MALFORMED_CHECK_RUNS_RESPONSE: no valid pages." ;;
          esac
          invalid_pages="$(jq -s '[.[] | select(
              (type != "object") or
              ((.total_count | type) != "number") or
              ((.check_runs | type) != "array")
            )] | length' <<< "$pages")"
          [ "$invalid_pages" -eq 0 ] || fail "MALFORMED_CHECK_RUNS_RESPONSE: invalid page structure."
          totals="$(jq -s '[.[].total_count] | unique' <<< "$pages")"
          [ "$(jq 'length' <<< "$totals")" -eq 1 ] \
            || fail "CHECK_RUNS_PAGINATION_TOTAL_COUNT_MISMATCH: pages disagree on total_count."
          total_count="$(jq -r '.[0]' <<< "$totals")"
          received="$(jq -s '[.[].check_runs | length] | add // 0' <<< "$pages")"
          [ "$received" -eq "$total_count" ] \
            || fail "CHECK_RUNS_PAGINATION_INCOMPLETE: total_count=$total_count received=$received."
          if ! checks="$(jq -s '[.[].check_runs[]]' <<< "$pages")"; then
            fail "MALFORMED_CHECK_RUNS_RESPONSE: invalid check_runs payload."
          fi
          malformed_runs="$(jq '[.[] | select(
              (type != "object") or
              ((.id | type) != "number") or
              ((.name | type) != "string") or
              ((.head_sha | type) != "string") or
              ((.status | type) != "string")
            )] | length' <<< "$checks")"
          [ "$malformed_runs" -eq 0 ] || fail "MALFORMED_CHECK_RUNS_RESPONSE: invalid check run."
          duplicates="$(jq '[.[].id] | length - (unique | length)' <<< "$checks")"
          [ "$duplicates" -eq 0 ] || fail "DUPLICATED_CHECK_RUNS: $duplicates duplicate id(s)."
          [ "$received" -gt 0 ] || fail "NO_CHECK_RUNS: the source SHA has no GitHub Actions check-runs."

          # Same check name from more than one app is ambiguous: fail closed.
          ambiguous="$(jq -r '
            group_by(.name) | map(select((map(.app.id) | unique | length) > 1)) |
            .[] | .[0].name' <<< "$checks")"
          [ -z "$ambiguous" ] || fail "AMBIGUOUS_CHECK_APP: $ambiguous."

          [ -n "$REQUIRED_CHECKS" ] || fail "MISSING_REQUIRED_CHECKS: no required checks declared for this SHA."
          [ -n "$AUTHORIZED_APPS" ] || fail "MISSING_AUTHORIZED_CHECK_APPS: no authorized apps declared for this SHA."

          # Required checks: presence, exact SHA, app identity, completed, SUCCESS.
          # The latest run per name (highest id) is the current attempt.
          IFS=',' read -ra required <<< "$REQUIRED_CHECKS"
          for name in "${required[@]}"; do
            name="$(printf '%s' "$name" | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//')"
            [ -n "$name" ] || fail "INVALID_REQUIRED_CHECKS_DECLARATION: empty required check."
            info="$(jq -r --arg name "$name" --arg sha "$SOURCE_SHA" '
              [ .[] | select(.name == $name and .head_sha == $sha) ] as $runs
              | if ($runs | length) == 0 then "MISSING"
                else ($runs | max_by(.id) | "\(.status)\t\(.conclusion)\t\(.app.slug // "")\t\(.app.id // "")")
                end' <<< "$checks")"
            [ "$info" != "MISSING" ] || fail "MISSING_REQUIRED_CHECK: $name."
            IFS=$'\t' read -r required_status required_conclusion app_slug app_id <<< "$info"
            [ -n "$app_slug" ] || fail "MISSING_REQUIRED_CHECK_APP: $name has no app identity."
            case "$app_id" in
              ''|*[!0-9]*) fail "MISSING_REQUIRED_CHECK_APP: $name has no app id." ;;
            esac
            case ",$AUTHORIZED_APPS," in
              *",$app_slug,"*) ;;
              *) fail "UNAUTHORIZED_REQUIRED_CHECK_APP: $name from $app_slug." ;;
            esac
            [ "$required_status" = "completed" ] || fail "PENDING_REQUIRED_CHECK: $name ($required_status)."
            [ "$required_conclusion" = "success" ] || fail "REQUIRED_CHECK_NOT_SUCCESS: $name ($required_conclusion)."
          done

          # Optional observed check-runs must be completed and non-failing.
          # The current workflow execution check-run is excluded by verifiable identity
          # (GitHub Actions app slug + run ID in details/html URL), never by generic name.
          current_run_id="${CURRENT_RUN_ID:-${GITHUB_RUN_ID:-}}"
          bad="$(jq -r --arg current_run_id "$current_run_id" '
            def is_current_execution:
              ($current_run_id != "" and ($current_run_id | test("^[0-9]+$")) and
               .app.slug == "github-actions" and
               (((.details_url // "") | test("/actions/runs/" + $current_run_id + "(/|$)")) or
                ((.html_url // "") | test("/actions/runs/" + $current_run_id + "(/|$)"))));
            [ .[] | select(is_current_execution | not) ] |
            group_by(.name) | map(max_by(.id)) |
            map(select(
              .status != "completed" or
              (.conclusion != "success" and .conclusion != "neutral" and .conclusion != "skipped")
            )) |
            .[] | "\(.name) (status=\(.status), conclusion=\(.conclusion))"' <<< "$checks" | tr '\n' ';')"
          [ -z "$bad" ] || fail "PENDING_OR_FAILED_CHECK_RUNS: $bad"

          successes="$(jq -r --arg current_run_id "$current_run_id" '
            def is_current_execution:
              ($current_run_id != "" and ($current_run_id | test("^[0-9]+$")) and
               .app.slug == "github-actions" and
               (((.details_url // "") | test("/actions/runs/" + $current_run_id + "(/|$)")) or
                ((.html_url // "") | test("/actions/runs/" + $current_run_id + "(/|$)"))));
            [ .[] | select(is_current_execution | not) ] |
            [group_by(.name)[] | max_by(.id) | select(.conclusion == "success")] | length' <<< "$checks")"
          [ "$successes" -gt 0 ] || fail "NO_SUCCESSFUL_CHECK_RUN: at least one check-run must conclude success."

          # Legacy commit statuses, when present, must also be green.
          if ! status_json="$(gh api "repos/$GITHUB_REPOSITORY/commits/$SOURCE_SHA/status")"; then
            fail "GITHUB_API_ERROR: commit status request failed."
          fi
          if ! status_total="$(jq -r '.total_count // 0' <<< "$status_json")"; then
            fail "MALFORMED_COMMIT_STATUS_RESPONSE."
          fi
          case "$status_total" in
            ''|*[!0-9]*) fail "MALFORMED_COMMIT_STATUS_RESPONSE: total_count missing." ;;
          esac
          if [ "$status_total" -gt 0 ]; then
            state="$(jq -r '.state // "pending"' <<< "$status_json")"
            [ "$state" = "success" ] || fail "LEGACY_STATUS_NOT_SUCCESS: combined status is $state."
          fi

  promote:
    needs: verify
    if: inputs.target != 'full'
    name: Promote to ${{ inputs.target }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        if: inputs.target == 'main' && hashFiles('package-lock.json') != ''
        with:
          node-version: 22
          cache: npm

      - name: Verify source and fast-forward safety
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.verify.outputs.source_sha }}
          SOURCE_BRANCH: ${{ needs.verify.outputs.source_branch }}
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          fail() { echo "::error::PROMOTION_BLOCKED_$1"; exit 1; }
          git fetch origin "$SOURCE_BRANCH" "$TARGET"
          current_source="$(git rev-parse "origin/$SOURCE_BRANCH")"
          [ "$current_source" = "$SOURCE_SHA" ] \
            || fail "SOURCE_MOVED: $SOURCE_BRANCH moved after verification."
          target_sha="$(git rev-parse "origin/$TARGET")"
          echo "Source ($SOURCE_BRANCH): $SOURCE_SHA"
          echo "Target ($TARGET) current: $target_sha"
          if [ "$SOURCE_SHA" = "$target_sha" ]; then
            echo "Already at target SHA. Nothing to promote."
            exit 0
          fi
          git merge-base --is-ancestor "$target_sha" "$SOURCE_SHA" \
            || fail "DIVERGENCE: $TARGET has commits not present in the source branch."

      - name: Main baseline integrity (pre-push)
        if: inputs.target == 'main' && hashFiles('package-lock.json') != ''
        run: npm ci

      - name: Fast-forward target ref
        run: git push origin "${{ needs.verify.outputs.source_sha }}:refs/heads/${{ inputs.target }}"

  promote_full:
    needs: verify
    if: inputs.target == 'full'
    name: Promote development through staging, production, and main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify source and full-chain safety
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.verify.outputs.source_sha }}
        run: |
          set -euo pipefail
          fail() { echo "::error::PROMOTION_BLOCKED_$1"; exit 1; }
          git fetch origin \
            "+refs/heads/development:refs/remotes/origin/development" \
            "+refs/heads/staging:refs/remotes/origin/staging" \
            "+refs/heads/production:refs/remotes/origin/production" \
            "+refs/heads/main:refs/remotes/origin/main"
          current_development="$(git rev-parse origin/development)"
          [ "$current_development" = "$SOURCE_SHA" ] \
            || fail "DEVELOPMENT_MOVED: development moved after verification."
          for target in staging production main; do
            target_sha="$(git rev-parse "origin/$target")"
            if ! git merge-base --is-ancestor "$target_sha" "$SOURCE_SHA"; then
              fail "DIVERGENCE: $target has commits outside development."
            fi
          done

      - name: Promote the full chain after fail-closed checks
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.verify.outputs.source_sha }}
        run: |
          set -euo pipefail
          for target in staging production main; do
            git push origin "$SOURCE_SHA:refs/heads/$target"
          done
